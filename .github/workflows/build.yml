name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore BossFind.sln --locked-mode

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build BossFind.sln -c Release --no-restore -m:1

      - name: Format check (informational)
        continue-on-error: true
        run: dotnet format BossFind.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test BossFind.sln -c Release --no-restore --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
